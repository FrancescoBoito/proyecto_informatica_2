[env:esp32dev]
; Mantiene la versión de la plataforma del proyecto original.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
; PlatformIO descarga estas bibliotecas al compilar.
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
