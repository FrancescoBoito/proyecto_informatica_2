[platformio]
default_envs = nodo1

; Ambos nodos usan el mismo programa y el mismo cableado del ESP32-C3.
[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_size = 4MB
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@0.8.0
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BMP085 Library@1.2.4

; Cada entorno identifica la placa. Usar Upload del entorno correspondiente.
; El Nodo 1 lleva DHT22 y el Nodo 2 lleva DHT11.
[env:nodo1]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ID_NODO=1

[env:nodo2]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ID_NODO=2
